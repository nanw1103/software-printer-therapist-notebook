    <rect x="615" y="148" width="110" height="38" rx="4"/><rect x="615" y="110" width="110" height="38" rx="4"/>
  </g>
  <rect x="615" y="72" width="110" height="38" rx="4" fill="#f3faf4" stroke="#2e8b4a" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M670,50 L670,262" stroke="#2e8b4a" stroke-width="1.5" stroke-dasharray="2 4" fill="none"/>
