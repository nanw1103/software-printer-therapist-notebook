  </defs>
  <rect width="900" height="340" fill="#ffffff"/>

  <!-- LEFT: crooked foundation, floors keep stacking -->
  <rect x="20" y="20" width="420" height="300" rx="12" fill="#fff5f5" stroke="#e0a0a0"/>
